<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KnockYourDoor – My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .profile-page { max-width: 900px; margin: 2.5rem auto; padding: 0 2.5rem; }
    .profile-card { background: white; border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; margin-bottom: 1.5rem; }
    .profile-header { background: linear-gradient(135deg, #0057FF, #003ACC); padding: 2.5rem; display: flex; align-items: center; gap: 1.5rem; color: white; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 3px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 2rem; font-weight: 800; flex-shrink: 0; }
    .profile-name { font-family: var(--display); font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    .profile-email { font-size: 14px; opacity: 0.8; }
    .profile-badge { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; }
    .profile-stats { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid var(--border); }
    .stat-box { padding: 1.25rem; text-align: center; border-right: 1px solid var(--border); }
    .stat-box:last-child { border-right: none; }
    .stat-box-num { font-family: var(--display); font-size: 1.6rem; font-weight: 800; color: var(--blue); }
    .stat-box-label { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 600; }
    .profile-section { background: white; border-radius: var(--radius); border: 1.5px solid var(--border); padding: 1.75rem; margin-bottom: 1.5rem; }
    .profile-section h3 { font-family: var(--display); font-size: 1.1rem; font-weight: 800; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--body); font-size: 14px; outline: none; background: var(--bg); }
    .form-group input:focus, .form-group select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-glow); background: white; }
    .save-btn { padding: 0.75rem 2rem; background: var(--blue); color: white; border: none; border-radius: 50px; font-family: var(--body); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .save-btn:hover { background: var(--blue-dark); transform: translateY(-2px); }
    .logout-btn { width: 100%; padding: 0.85rem; background: #FEE2E2; color: var(--danger); border: none; border-radius: var(--radius-sm); font-family: var(--body); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .logout-btn:hover { background: #FECACA; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="home.html" class="nav-logo"><div class="logo-dot"></div>Knock<span>YourDoor</span></a>
  <div class="nav-search">
    <input type="text" placeholder="Search products..." id="search-input"/>
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="nav-actions">
    <a href="home.html" class="nav-link">Home</a>
    <a href="orders.html" class="nav-link">Orders</a>
    <a href="profile.html" class="nav-link active">Profile</a>
    <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-count" style="display:none">0</span></a>
  </div>
  <button class="hamburger" id="hamburger-btn" onclick="toggleMobileMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <div class="mobile-search">
    <input type="text" id="mobile-search-input" placeholder="Search products..."/>
    <button onclick="doMobileSearch()">Search</button>
  </div>
      <a href="home.html" class="mobile-nav-link "><span class="m-icon">🏠</span> Home</a>
      <a href="orders.html" class="mobile-nav-link "><span class="m-icon">📋</span> Orders</a>
      <a href="profile.html" class="mobile-nav-link active"><span class="m-icon">👤</span> Profile</a>
      <a href="cart.html" class="mobile-nav-link mobile-cart-link"><span class="m-icon">🛒</span> Cart</a>
</div>

<script>
  function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const btn = document.getElementById('hamburger-btn');
    menu.classList.toggle('open');
    btn.classList.toggle('open');
  }
  function doMobileSearch() {
    const q = document.getElementById('mobile-search-input').value.trim();
    if (q) window.location.href = 'search.html?q=' + encodeURIComponent(q);
  }
  document.getElementById('mobile-search-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') doMobileSearch();
  });
</script>

<div class="profile-page">
  <div class="section-title">My <span>Profile</span></div>

  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar" id="avatar-initials">?</div>
      <div>
        <div class="profile-name" id="profile-name">Loading...</div>
        <div class="profile-email" id="profile-email"></div>
        <div class="profile-badge">⭐ KYD Member</div>
      </div>
    </div>
    <div class="profile-stats">
      <div class="stat-box">
        <div class="stat-box-num" id="total-orders">0</div>
        <div class="stat-box-label">Total Orders</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-num" id="total-spent">₹0</div>
        <div class="stat-box-label">Total Spent</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-num" id="saved-amount">₹0</div>
        <div class="stat-box-label">Total Saved</div>
      </div>
    </div>
  </div>

  <div class="profile-section">
    <h3>📝 Personal Information</h3>
    <div class="form-row">
      <div class="form-group"><label>Full Name</label><input type="text" id="edit-name" placeholder="Your name"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="edit-email" placeholder="you@example.com"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Phone</label><input type="tel" id="edit-phone" placeholder="+91 98765 43210"/></div>
      <div class="form-group"><label>Date of Birth</label><input type="date" id="edit-dob"/></div>
    </div>
    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
  </div>

  <div class="profile-section">
    <h3>📍 Delivery Address</h3>
    <div class="form-row">
      <div class="form-group"><label>Address Line 1</label><input type="text" id="addr1" placeholder="House/Flat no., Street"/></div>
      <div class="form-group"><label>City</label><input type="text" id="addr-city" placeholder="Panipat"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>State</label><input type="text" id="addr-state" placeholder="Haryana"/></div>
      <div class="form-group"><label>PIN Code</label><input type="text" id="addr-pin" placeholder="132103"/></div>
    </div>
    <button class="save-btn" onclick="saveAddress()">Save Address</button>
  </div>

  <div class="profile-section">
    <h3>⚙️ Account Settings</h3>
    <button class="logout-btn" onclick="logout()">🚪 Logout from KnockYourDoor</button>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">Knock<span>YourDoor</span></div>
    <p>© 2026 <span>KnockYourDoor</span> — Built by Aman Kumar</p>
  </div>
</footer>

<script src="main.js"></script>
<script>
  if (!getUser()) window.location.href = 'index.html';

  const user = getUser();
  const orders = getOrders();

  document.getElementById('avatar-initials').textContent = user.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('profile-name').textContent = user.name;
  document.getElementById('profile-email').textContent = user.email;
  document.getElementById('edit-name').value = user.name;
  document.getElementById('edit-email').value = user.email;

  const totalSpent = orders.filter(o => o.status !== 'Cancelled').reduce((s, o) => s + o.total, 0);
  const saved = Math.round(totalSpent * 0.05);
  document.getElementById('total-orders').textContent = orders.length;
  document.getElementById('total-spent').textContent = '₹' + totalSpent.toLocaleString();
  document.getElementById('saved-amount').textContent = '₹' + saved.toLocaleString();

  // Restore saved address
  const addr = JSON.parse(localStorage.getItem('kyd_address') || '{}');
  if (addr.addr1) document.getElementById('addr1').value = addr.addr1;
  if (addr.city) document.getElementById('addr-city').value = addr.city;
  if (addr.state) document.getElementById('addr-state').value = addr.state;
  if (addr.pin) document.getElementById('addr-pin').value = addr.pin;

  function saveProfile() {
    const name = document.getElementById('edit-name').value.trim();
    const email = document.getElementById('edit-email').value.trim();
    if (!name || !email) { showToast('Please fill all fields', 'error'); return; }
    saveUser({ ...user, name, email });
    document.getElementById('profile-name').textContent = name;
    document.getElementById('avatar-initials').textContent = name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    showToast('Profile updated! ✅', 'success');
  }

  function saveAddress() {
    const addr = {
      addr1: document.getElementById('addr1').value,
      city: document.getElementById('addr-city').value,
      state: document.getElementById('addr-state').value,
      pin: document.getElementById('addr-pin').value,
    };
    localStorage.setItem('kyd_address', JSON.stringify(addr));
    showToast('Address saved! 📍', 'success');
  }
</script>
</body>
</html>
